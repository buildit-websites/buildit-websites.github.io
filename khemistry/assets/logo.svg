<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 56" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Khemistry</title>
  <desc id="logo-desc">Periodic-table mark: Pp People, Pl Place, and Pu Purpose.</desc>
  <rect x="0" y="0" width="64" height="56" rx="3" fill="#0E2744"/>
  <rect x="70" y="0" width="64" height="56" rx="3" fill="#115E68"/>
  <rect x="140" y="0" width="64" height="56" rx="3" fill="#1A4570"/>
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace">
    <text x="6" y="13" font-size="8" fill="#F7F3EB" fill-opacity="0.72">01</text>
    <text x="32" y="33" text-anchor="middle" font-size="18" fill="#9AE7EE">Pp</text>
    <text x="32" y="48" text-anchor="middle" font-size="8" fill="#F7F3EB" font-family="ui-sans-serif, system-ui, sans-serif">People</text>
    <text x="76" y="13" font-size="8" fill="#F7F3EB" fill-opacity="0.72">02</text>
    <text x="102" y="33" text-anchor="middle" font-size="18" fill="#F7F3EB">Pl</text>
    <text x="102" y="48" text-anchor="middle" font-size="8" fill="#F7F3EB" font-family="ui-sans-serif, system-ui, sans-serif">Place</text>
    <text x="146" y="13" font-size="8" fill="#F7F3EB" fill-opacity="0.72">03</text>
    <text x="172" y="33" text-anchor="middle" font-size="18" fill="#F7F3EB">Pu</text>
    <text x="172" y="48" text-anchor="middle" font-size="8" fill="#F7F3EB" font-family="ui-sans-serif, system-ui, sans-serif">Purpose</text>
  </g>
</svg>
